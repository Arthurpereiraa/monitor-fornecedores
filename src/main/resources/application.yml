spring:
  application:
    name: monitor-fornecedores
  # Padrão: banco H2 em memória, para rodar sem instalar nada. Use o perfil "postgres" para PostgreSQL.
  datasource:
    url: jdbc:h2:mem:fornecedores;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none # o esquema é das migrações do Flyway
  mvc:
    problemdetails:
      enabled: true
  batch:
    job:
      enabled: false # o job roda pelo agendamento ou pela API, não ao subir a aplicação
    jdbc:
      initialize-schema: always # cria as tabelas de metadados do Spring Batch (BATCH_*)

app:
  apis:
    brasilapi-url: https://brasilapi.com.br/api
    minha-receita-url: https://minhareceita.org
    viacep-url: https://viacep.com.br/ws
    timeout: 15s
  reavaliacao:
    cron: "0 0 2 * * *" # todo dia às 2h (horário de Brasília)
    intervalo: 300ms # pausa entre fornecedores, para respeitar o limite das APIs públicas
    limite-falhas: 20

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fornecedores}
    username: ${DB_USER:fornecedores}
    password: ${DB_PASSWORD:fornecedores}
